<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Let Us Cook</title>
    <link rel="stylesheet" href="common.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav>
        <div class="nav-container">
            <a href="index.html" class="logo">🍳 Let Us Cook</a>
            
            <div class="nav-controls">
                <button class="language-toggle" aria-label="Toggle language">EN</button>
                <button class="theme-toggle" aria-label="Toggle theme">🌙</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="form-container">
            <h2 class="form-title" data-i18n="auth.signup.title">Create Your Account</h2>
            <form id="signupForm">
                <div class="form-group">
                    <label for="name" data-i18n="auth.name">Full Name</label>
                    <input type="text" id="name" class="form-input" required>
                    <div class="error-message"></div>
                </div>

                <div class="form-group">
                    <label for="email" data-i18n="auth.email">Email Address</label>
                    <input type="email" id="email" class="form-input" required>
                    <div class="error-message"></div>
                </div>

                <div class="form-group">
                    <label for="phone" data-i18n="auth.phone">Phone Number</label>
                    <input type="tel" id="phone" class="form-input" placeholder="+1234567890">
                    <div class="error-message"></div>
                </div>

                <div class="form-group">
                    <label for="password" data-i18n="auth.password">Password</label>
                    <input type="password" id="password" class="form-input" required>
                    <div class="error-message"></div>
                    <small style="color: var(--text-secondary); display: block; margin-top: 0.3rem;">
                        Must be at least 8 characters with letters and numbers
                    </small>
                    <div id="passwordStrength" style="margin-top: 0.5rem; display: none;">
                        <div style="height: 4px; background: var(--border-color); border-radius: 2px; overflow: hidden;">
                            <div id="strengthBar" style="height: 100%; width: 0%; transition: all 0.3s ease;"></div>
                        </div>
                        <small id="strengthText" style="font-size: 0.85rem;"></small>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" data-i18n="auth.confirm">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-input" required>
                    <div class="error-message"></div>
                </div>

                <button type="submit" class="btn-submit" data-i18n="auth.signup.button">Sign Up</button>

                <div class="form-footer">
                    <span data-i18n="auth.signup.footer">Already have an account?</span> <a href="index.html" data-i18n="nav.login">Log In</a>
                </div>
            </form>
        </div>
    </div>

    <script src="common.js"></script>
    <script>
        // Password strength indicator
        document.getElementById('password').addEventListener('input', function() {
            const password = this.value;
            const strengthDiv = document.getElementById('passwordStrength');
            const strengthBar = document.getElementById('strengthBar');
            const strengthText = document.getElementById('strengthText');
            
            if (password.length > 0) {
                strengthDiv.style.display = 'block';
                const strength = getPasswordStrength(password);
                
                let widthPercent = 33;
                if (strength.level === 'medium') widthPercent = 66;
                if (strength.level === 'strong') widthPercent = 100;
                
                strengthBar.style.width = widthPercent + '%';
                strengthBar.style.backgroundColor = strength.color;
                strengthText.textContent = `Password strength: ${strength.level}`;
                strengthText.style.color = strength.color;
            } else {
                strengthDiv.style.display = 'none';
            }
        });
        
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Clear previous errors
            document.querySelectorAll('.form-input').forEach(input => clearError(input));
            
            let isValid = true;
            
            // Get form values
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // Validate name
            if (!validateRequired(name)) {
                showError(document.getElementById('name'), 'Name is required');
                isValid = false;
            }
            
            // Validate email
            if (!validateRequired(email)) {
                showError(document.getElementById('email'), 'Email is required');
                isValid = false;
            } else if (!validateEmail(email)) {
                showError(document.getElementById('email'), 'Please enter a valid email address');
                isValid = false;
            }
            
            // Validate phone
            if (phone && !validatePhone(phone)) {
                showError(document.getElementById('phone'), 'Please enter a valid phone number');
                isValid = false;
            }
            
            // Validate password
            if (!validateRequired(password)) {
                showError(document.getElementById('password'), 'Password is required');
                isValid = false;
            } else if (!validatePassword(password)) {
                showError(document.getElementById('password'), 'Password must be at least 8 characters with letters and numbers');
                isValid = false;
            }
            
            // Validate confirm password
            if (!validateRequired(confirmPassword)) {
                showError(document.getElementById('confirmPassword'), 'Please confirm your password');
                isValid = false;
            } else if (password !== confirmPassword) {
                showError(document.getElementById('confirmPassword'), 'Passwords do not match');
                isValid = false;
            }
            
            if (isValid) {
                const submitButton = this.querySelector('.btn-submit');
                const originalText = submitButton.textContent;
                submitButton.textContent = 'Creating account...';
                submitButton.disabled = true;

                try {
                    // Call backend API
                    const API_URL = '/api';
                    const response = await fetch(`${API_URL}/signup`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            name: name,
                            email: email,
                            phone: phone || null,
                            password: password
                        })
                    });

                    const data = await response.json();

                    if (response.ok && data.success) {
                        showSuccessModal('Account created successfully! Please log in.');
                        setTimeout(() => {
                            window.location.href = 'index.html';  // Login page is now index.html
                        }, 2000);
                    
                    } else {
                        if (response.status === 409) {
                            showError(document.getElementById('email'), 'An account with this email already exists');
                        } else {
                            showError(document.getElementById('email'), data.message || 'Failed to create account');
                        }
                        submitButton.textContent = originalText;
                        submitButton.disabled = false;
                    }
                } catch (error) {
                    console.error('Signup error:', error);
                    showError(document.getElementById('email'), 'Network error. Make sure the backend server is running on http://localhost:3000');
                    submitButton.textContent = originalText;
                    submitButton.disabled = false;
                }
            }
        });
    </script>
</body>
</html>
