<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Let Us Cook</title>
    <link rel="stylesheet" href="common.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav>
        <div class="nav-container">
            <a href="index.html" class="logo">🍳 Let Us Cook</a>
            
            <div class="nav-controls">
                <button class="language-toggle" aria-label="Toggle language">EN</button>
                <button class="theme-toggle" aria-label="Toggle theme">🌙</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="form-container">
            <h2 class="form-title" data-i18n="auth.login.title">Welcome Back!</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email" data-i18n="auth.email">Email Address</label>
                    <input type="email" id="email" class="form-input" required>
                    <div class="error-message"></div>
                </div>

                <div class="form-group">
                    <label for="password" data-i18n="auth.password">Password</label>
                    <input type="password" id="password" class="form-input" required>
                    <div class="error-message"></div>
                </div>

                <button type="submit" class="btn-submit" data-i18n="auth.login.button">Log In</button>

                <div class="form-footer">
                    <span data-i18n="auth.login.footer">Don't have an account?</span> <a href="signup.html" data-i18n="nav.signup">Sign Up</a>
                </div>
            </form>
        </div>
    </div>

    <script src="common.js"></script>
    <script>
        const API_URL = '/api';

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Clear previous errors
            document.querySelectorAll('.form-input').forEach(input => clearError(input));
            
            let isValid = true;
            
            // Get form values
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            // Validate email
            if (!validateRequired(email)) {
                showError(document.getElementById('email'), 'Email is required');
                isValid = false;
            } else if (!validateEmail(email)) {
                showError(document.getElementById('email'), 'Please enter a valid email address');
                isValid = false;
            }
            
            // Validate password
            if (!validateRequired(password)) {
                showError(document.getElementById('password'), 'Password is required');
                isValid = false;
            }
            
            if (isValid) {
                const submitButton = this.querySelector('.btn-submit');
                const originalText = submitButton.textContent;
                submitButton.textContent = 'Logging in...';
                submitButton.disabled = true;

                try {
                    // Call backend API
                    const response = await fetch(`${API_URL}/login`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email, password })
                    });

                    const data = await response.json();

                    if (response.ok && data.success) {
                        // Store current user (without password)
                        localStorage.setItem('currentUser', JSON.stringify(data.data.user));
                        
                        // Show success message
                        showSuccessModal('Login successful! Welcome back!');
                        
                        // Redirect after a short delay
                        setTimeout(() => {
                            // Check if there's a redirect URL saved
                            const redirectUrl = localStorage.getItem('redirectAfterLogin');
                            if (redirectUrl) {
                                localStorage.removeItem('redirectAfterLogin');
                                window.location.href = redirectUrl;
                            } else {
                                window.location.href = 'login.html';  // Home page
                            }
                        }, 1500);
                    } else {
                        showError(document.getElementById('email'), data.message || 'Invalid email or password');
                        showError(document.getElementById('password'), data.message || 'Invalid email or password');
                        submitButton.textContent = originalText;
                        submitButton.disabled = false;
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    showError(document.getElementById('email'), 'Network error. Make sure the backend server is running on http://localhost:3000');
                    submitButton.textContent = originalText;
                    submitButton.disabled = false;
                }
            }
        });
    </script>
</body>
</html>
