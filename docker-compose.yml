services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: letuscook-db
    environment:
      POSTGRES_USER: cookuser
      POSTGRES_PASSWORD: cookpass
      POSTGRES_DB: letuscook
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cookuser -d letuscook"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - letuscook-network
    restart: unless-stopped

  # Go Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: letuscook-backend
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: cookuser
      DB_PASSWORD: cookpass
      DB_NAME: letuscook
      DB_SSLMODE: disable
      SERVER_PORT: 3000
      SERVER_HOST: 0.0.0.0
      ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - letuscook-network
    restart: unless-stopped

  # Nginx Web Server (Frontend + Reverse Proxy)
  nginx:
    image: nginx:alpine
    container_name: letuscook-nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - letuscook-network
    restart: unless-stopped

networks:
  letuscook-network:
    driver: bridge

volumes:
  postgres_data:
