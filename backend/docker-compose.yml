
services:
  postgres:
    image: postgres:15-alpine
    container_name: letuscook-db
    environment:
      POSTGRES_USER: cookuser
      POSTGRES_PASSWORD: cookpass
      POSTGRES_DB: letuscook
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cookuser -d letuscook"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - letuscook-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: letuscook-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: cookuser
      DB_PASSWORD: cookpass
      DB_NAME: letuscook
      DB_SSLMODE: disable
      SERVER_PORT: 3000
      SERVER_HOST: 0.0.0.0
      ENV: production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - letuscook-network
    restart: unless-stopped

networks:
  letuscook-network:
    driver: bridge

volumes:
  postgres_data:
